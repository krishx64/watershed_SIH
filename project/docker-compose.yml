services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: watershed-backend:local
    container_name: watershed-api-server
    ports:
      - "8000:8080"
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - PYTHONUNBUFFERED=1
      - MONGO_URI=mongodb://host.docker.internal:27017
    volumes:
      - ./src:/app/src
      - ./app:/app/app
      - ./data:/app/data
      - ./models:/app/models
      - ./bhoonidhi_data:/app/bhoonidhi_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
